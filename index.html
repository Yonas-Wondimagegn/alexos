<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#10141c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>AlexOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#10141c;--s1:#181e2a;--s2:#232b3c;--tx:#ebe7dc;--mut:#8d93a3;--ac:#f0b84a;--ok:#7fd1a0;--bad:#e8826f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3efe6;--s1:#fffdf8;--s2:#e8e2d4;--tx:#1b1f2a;--mut:#6b6f7c;--ac:#a86a00;--ok:#2f8a5a;--bad:#b9442f;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:28px;font-weight:800;margin:0 0 2px;letter-spacing:-.02em}h2{font-size:18px;font-weight:600;margin:22px 0 8px}
.mut{color:var(--mut);font-size:14px}.card{background:var(--s1);border-radius:16px;padding:14px;margin:10px 0}
.hero{display:flex;gap:16px;align-items:center}
.ring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--s2) 0)}
.ring div{width:88px;height:88px;border-radius:50%;background:var(--s1);display:grid;place-items:center;text-align:center;font-size:30px;font-weight:800;line-height:1}
.ring small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:4px}
.stats{display:flex;gap:18px;margin-top:6px}.stats b{display:block;font-size:22px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--s2);cursor:pointer;min-height:48px}.row:last-child{border:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--mut);flex:none;display:grid;place-items:center}
.on .box{background:var(--ok);border-color:var(--ok);color:#10141c}.on .t{color:var(--mut);text-decoration:line-through}
.xp{margin-left:auto;color:var(--ac);font-size:14px;font-weight:600}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--s2);border:0;border-radius:12px;padding:12px;width:100%;margin:4px 0}
textarea{min-height:90px;font-size:13px}
button{background:var(--ac);color:#10141c;font-weight:600;cursor:pointer}button.g{background:var(--s2);color:var(--tx)}
button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,nav a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:8px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--s1);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--s2)}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);border-radius:10px;cursor:pointer}nav a.on{color:var(--ac);font-weight:600}
.timer{font-size:56px;font-weight:800;text-align:center;letter-spacing:-.03em;margin:6px 0}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const COURSES=[["Software Engineering",4],["Advanced Database Systems",4],["Research Methods",3],["Internet Programming I",3],["Numerical Analysis",3],["Introduction to Algorithms",3]];
const H=[["mp","Morning prayer",20],["bible","Bible reading",40],["wo","Workout",40],["code","Solved a problem",30],["skill","Skill session",15],["top3","Top 3 finished",30],["reset","Evening reset",15],["np","Night prayer",20]];
const TC=["Risk % set","Stop loss set","Take profit set","RR calculated","Setup is valid","Session identified"];
const TABS=[['today','Today'],['study','Study'],['train','Train'],['trade','Trade'],['code','Code'],['more','More']];
const K="alexos2";let S,tab="today",tick={},tm=null,left=1500,sel=0,msg="",skipGate=false;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{days:{},spent:0,freezes:0,plan:null,base:{p:20,s:10},start:key(new Date())};
function norm(){S.probs=S.probs||[];S.skills=S.skills||[];S.ch=S.ch||0;S.wind=S.wind||22;S.frozen=S.frozen||{};S.start=S.start||key(new Date())}norm();
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function back(n){const d=new Date();d.setDate(d.getDate()-n);return key(d)}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function D(k){return S.days[k||key(new Date())]||(S.days[k||key(new Date())]={done:{},top:["","",""],mins:{},tr:[],xp:0,ws:0})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function total(){return Object.values(S.days).reduce((a,d)=>a+(d.xp||0),0)-S.spent}
function streak(){let n=0,m=0;for(let i=0;i<400;i++){const k=back(i),d=S.days[k];if(k<S.start)break;if(d&&d.xp>=100){n++;m=0}else if(S.frozen[k]){m=0}else if(i>0){if(++m>=2){if(S.freezes>0){S.frozen[k]=1;S.freezes--;save();m=0}else break}}}return n}
function plan(){const k=["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];const p=S.plan&&S.plan.dailyChecklist&&S.plan.dailyChecklist.find(x=>x.day===k);return p?p.items:[]}
function toggle(id,xp){const d=D();if(d.done[id]){delete d.done[id];d.xp-=xp}else{d.done[id]=1;d.xp+=xp}save();R()}
function target(){const w=Math.floor((new Date()-new Date(S.start))/6048e5);const f=Math.pow(1.1,Math.max(0,w));return[Math.round(S.base.p*f),Math.round(S.base.s*f)]}
function R(){
 const d=D(),x=total(),str=streak(),pct=Math.min(100,Math.round(d.xp/250*100));let h="";
 if(gateOn()){gate();return}
 if(tab==="today"){
  h=`<h1>Today</h1><div class="mut">${dstr()}</div>
  <div class="card hero"><div class="ring" style="--p:${pct}"><div>${d.xp}<small>of 250 XP</small></div></div>
  <div><div class="stats"><span><b>${str}</b><span class="mut">day streak</span></span><span><b>${S.freezes}</b><span class="mut">freezes</span></span></div>
  <div class="mut" style="margin-top:8px">${x.toLocaleString()} XP banked</div>
  <button class="g" data-a="buy" style="padding:8px;margin-top:6px">${x>=5000&&S.freezes<2?"Buy freeze (5,000 XP)":"Freeze costs 5,000 XP"}</button></div></div>
  <h2>Top 3 for today</h2><div class="card">${[0,1,2].map(i=>`<input data-a="top" data-i="${i}" placeholder="Priority ${i+1}" value="${esc(d.top[i])}">`).join("")}</div>
  <h2>Checklist</h2><div class="card">${H.map(([id,l,p])=>row(id,l,p)).join("")}${plan().map(i=>row(i.id,i.label,i.xp||10)).join("")}</div>`;
 }
 if(tab==="study"){
  const wk=COURSES.map(([c])=>[c,[...Array(7)].reduce((a,_,i)=>a+((S.days[back(i)]||{mins:{}}).mins[c]||0),0)]);
  h=`<h1>Study</h1><div class="mut">Credit-weighted, 20 h/week target</div>
  <div class="card"><div class="timer">${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}</div>
  <select data-a="sel">${COURSES.map(([c],i)=>`<option value="${i}" ${i===sel?"selected":""}>${c}</option>`).join("")}</select>
  <button data-a="timer">${tm?"Stop":"Start 25-min focus"}</button></div>
  <h2>This week</h2><div class="card">${COURSES.map(([c,w],i)=>{const goal=w/20*1200,m=wk[i][1];return`<div style="margin:10px 0"><div style="display:flex"><span>${c}</span><span class="xp">${m}/${Math.round(goal)} min</span></div><div class="bar"><i style="width:${Math.min(100,m/goal*100)}%"></i></div></div>`}).join("")}</div>`;
 }
 if(tab==="train"){const[p,s]=target();
  h=`<h1>Train</h1><div class="mut">Home workout, +10% each week from your baseline</div>
  <div class="card"><div class="stats"><span><b>${p}</b><span class="mut">push-ups</span></span><span><b>${s}</b><span class="mut">squats</span></span></div>
  <button data-a="wo" style="margin-top:12px">${d.done.wo?"Workout done today (tap to undo)":"Mark workout done (+40 XP)"}</button></div>
  <h2>Baseline</h2><div class="card two"><input type="number" data-a="bp" value="${S.base.p}" aria-label="Push-ups baseline"><input type="number" data-a="bs" value="${S.base.s}" aria-label="Squats baseline"></div>
  <div class="mut">Goal: 100 push-ups and 50 squats in one go.</div>`;
 }
 if(tab==="trade"){const ok=TC.every((_,i)=>tick[i]);
  h=`<h1>Trade</h1><div class="mut">Tick every box to unlock the journal</div><div class="card">${TC.map((c,i)=>`<div class="row ${tick[i]?"on":""}" data-a="tick" data-i="${i}"><span class="box">${tick[i]?"✓":""}</span><span class="t">${c}</span></div>`).join("")}</div>`;
  if(ok)h+=`<div class="card"><input id="pair" placeholder="Pair (e.g. XAUUSD)"><select id="sess"><option>London</option><option>New York</option><option>Asian</option></select>
  <textarea id="th" placeholder="What I was thinking at entry"></textarea><textarea id="why" placeholder="Why this setup"></textarea>
  <select id="res"><option>TP</option><option>SL</option><option>BE</option></select><textarea id="end" placeholder="How the market ended up"></textarea><textarea id="ref" placeholder="Reflection"></textarea>
  <button data-a="logtrade">Save trade (+25 XP)</button></div>`;
  const all=Object.keys(S.days).sort().reverse().flatMap(k=>S.days[k].tr.map(t=>({...t,k}))).slice(0,8);
  h+=`<h2>Recent trades</h2>${all.length?all.map(t=>`<div class="card"><b>${esc(t.pair)}</b> <span class="mut">${t.k} · ${t.sess}</span> <span class="xp" style="color:${t.res==="TP"?"var(--ok)":t.res==="SL"?"var(--bad)":"var(--mut)"}">${t.res}</span><div class="mut">${esc(t.ref||t.why||"")}</div></div>`).join(""):`<div class="mut">No trades yet. Finish the checklist, then log your first one.</div>`}`;
 }
 if(tab==="code")h=codeTab();
 if(tab==="more"){
  h=more()+`<h2>Weekly review</h2><div class="mut">Export the review, send it to Claude, import the plan you get back</div>
  <div class="card"><button data-a="review">Generate weekly review</button><button class="g" data-a="backup">Show full backup</button>
  <textarea id="out" placeholder="Your JSON appears here. Copy it."></textarea><button class="g" data-a="copy">Copy</button></div>
  <h2>Import next week's plan</h2><div class="card"><textarea id="in" placeholder="Paste next-week-plan.json or a backup"></textarea>
  <button data-a="import">Import</button><div class="mut" id="msg">${esc(msg)}</div></div>
  ${S.plan?`<div class="mut">Active plan from week of ${esc(S.plan.weekStart||"?")}: ${(S.plan.goals||[]).map(g=>esc(g.text)).join("; ")}</div>`:""}`;
 }
 $("#app").innerHTML=h;
 $("#nav").innerHTML=TABS.map(([t,l])=>`<a role="button" tabindex="0" data-a="tab" data-t="${t}" class="${tab===t?"on":""}">${l}</a>`).join("");
}
function addd(n){const d=new Date();d.setDate(d.getDate()+n);return key(d)}
function eth(n){const j=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5)+2440588,e=j-1723856,r=e%1461,q=(r%365)+365*Math.floor(r/1460);return{y:4*Math.floor(e/1461)+Math.floor(r/365)-Math.floor(r/1460),m:Math.floor(q/30),d:(q%30)+1}}
function dstr(){const n=new Date();if(!S.eth)return n.toDateString();const e=eth(n);return ['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Genbot','Sene','Hamle','Nehase','Pagume'][e.m]+' '+e.d+', '+e.y}
function gateOn(){const h=new Date().getHours();return location.hash==='#gate'||(!skipGate&&!D().done.wo&&(h>=S.wind||h<4))}
function gate(){const d=D(),t=target();$('#nav').innerHTML='';$('#app').innerHTML=d.done.wo?`<h1>Wind down</h1><div class='card'><p>Workout done. Phone down, lights low.</p><button class='g' data-a='open'>Open AlexOS</button></div>`:`<h1>Night gate</h1><div class='mut'>Before the scroll: ${t[0]} push-ups and ${t[1]} squats.</div><div class='card'><button data-a='gwo'>Workout done (+40 XP)</button><button class='g' data-a='open' style='margin-top:24px;opacity:.7'>Not tonight</button></div>`}
function codeTab(){const t=key(new Date()),due=S.probs.map((p,i)=>({p,i})).filter(o=>!o.p.done&&o.p.next&&o.p.next<=t);return`<h1>Code</h1><div class='mut'>Log every problem. Ones you miss come back after 1, 3, 7 and 14 days.</div><div class='card'><input id='pt' placeholder='Problem name'><div class='two'><select id='pp'><option>Arrays</option><option>Strings</option><option>Hashing</option><option>Two pointers</option><option>Trees</option><option>Graphs</option><option>DP</option><option>Sorting</option><option>SQL</option></select><select id='pd'><option>Easy</option><option>Medium</option><option>Hard</option></select></div><select id='ps'><option value='yes'>Solved alone</option><option value='no'>Needed help or failed</option></select><button data-a='saveprob'>Save problem (+30 XP)</button></div><h2>Due for review (${due.length})</h2>${due.length?due.map(o=>`<div class='card'>${esc(o.p.t)} <span class='mut'>${o.p.pat}</span><div class='two'><button data-a='rev' data-i='${o.i}' data-r='y'>Solved it</button><button class='g' data-a='rev' data-i='${o.i}' data-r='n'>Still stuck</button></div></div>`).join(''):`<div class='mut'>Nothing due. Missed problems show up here.</div>`}<div class='mut' style='margin-top:10px'>${S.probs.length} problems logged.</div>`}
function more(){const u=location.href.split('#')[0]+'#gate';return`<h1>More</h1><h2>Bible reading</h2><div class='card'>${S.ch} of 1,189 chapters<div class='bar'><i style='width:${S.ch/1189*100}%'></i></div><button data-a='ch' style='margin-top:10px'>+1 chapter read</button></div><h2>Skills</h2><div class='card'><div class='two'><input id='sm' type='number' placeholder='Minutes'><input id='sn' placeholder='Drawing, what I tried'></div><button data-a='skill'>Log skill session (+15 XP)</button><div class='mut'>${S.skills.slice(-3).reverse().map(s=>s.date+' · '+s.min+' min '+esc(s.note)).join('<br>')}</div></div><h2>Settings</h2><div class='card'><label class='mut'>Night gate starts at hour (0 to 23)</label><input type='number' data-a='wind' value='${S.wind}'><label class='mut'>Calendar</label><select data-a='eth'><option value='0' ${S.eth?'':'selected'}>Gregorian</option><option value='1' ${S.eth?'selected':''}>Ethiopian</option></select><div class='mut' style='margin-top:8px'>iPhone Shortcuts: Automation, App, pick Instagram, TikTok, Snapchat, X, YouTube, Clash of Clans, Is Opened, then Open URL: ${esc(u)}. Also turn on Screen Time Downtime. A web app can’t block other apps.</div></div>`}
function row(id,l,p){const on=D().done[id];return`<div class="row ${on?"on":""}" tabindex="0" data-a="chk" data-id="${id}" data-xp="${p}"><span class="box">${on?"✓":""}</span><span class="t">${esc(l)}</span><span class="xp">+${p}</span></div>`}
function $(s){return document.querySelector(s)}
function review(){const days=[...Array(7)].map((_,i)=>back(i)),hab={},mins={},wo=[];let tr=0,win=0;
 [...H.map(h=>h[0])].forEach(id=>hab[id]={done:0,missed:0});
 days.forEach(k=>{const d=S.days[k]||{done:{},mins:{},tr:[]};Object.keys(hab).forEach(id=>d.done[id]?hab[id].done++:hab[id].missed++);
  for(const c in d.mins)mins[c]=(mins[c]||0)+d.mins[c];if(d.done.wo)wo.push(k);d.tr.forEach(t=>{tr++;if(t.res==="TP")win++})});
 return{weekEnd:days[0],xp:days.reduce((a,k)=>a+((S.days[k]||{}).xp||0),0),streak:streak(),habits:hab,studyMinutes:mins,workoutDays:wo,workoutTarget:target(),trades:{count:tr,tp:win},problems:S.probs.filter(p=>days.includes(p.date)).length,skillMinutes:S.skills.filter(s=>days.includes(s.date)).reduce((a,s)=>a+s.min,0),bibleChapters:S.ch,notesForNextWeek:""}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,d=D();
 if(a==="tab"){tab=t.dataset.t;R()}
 if(a==='open'){skipGate=true;try{location.hash=''}catch(x){}R()}
 if(a==='gwo')toggle('wo',40);
 if(a==='ch'){S.ch=Math.min(1189,S.ch+1);save();R()}
 if(a==='skill'){const m=+$('#sm').value||0;if(!m)return;S.skills.push({date:key(new Date()),min:m,note:$('#sn').value});if(!d.done.skill){d.done.skill=1;d.xp+=15}save();R()}
 if(a==='saveprob'){const n=$('#pt').value.trim();if(!n)return;const solo=$('#ps').value==='yes',p={t:n,pat:$('#pp').value,diff:$('#pd').value,solo,date:key(new Date()),ri:0,done:solo};if(!solo)p.next=addd(1);S.probs.push(p);d.done.code=1;d.xp+=30+(solo?10:0);save();R()}
 if(a==='rev'){const p=S.probs[+t.dataset.i];if(t.dataset.r==='y'){p.ri++;if(p.ri>=4)p.done=1;else p.next=addd([1,3,7,14][p.ri])}else{p.ri=0;p.next=addd(1)}d.xp+=10;save();R()}
 if(a==="chk")toggle(t.dataset.id,+t.dataset.xp);
 if(a==="buy"&&total()>=5000&&S.freezes<2){S.spent+=5000;S.freezes++;save();R()}
 if(a==="wo")toggle("wo",40);
 if(a==="tick"){tick[t.dataset.i]=!tick[t.dataset.i];R()}
 if(a==="logtrade"){d.tr.push({pair:$("#pair").value||"?",sess:$("#sess").value,th:$("#th").value,why:$("#why").value,res:$("#res").value,end:$("#end").value,ref:$("#ref").value});d.xp+=25;tick={};save();R()}
 if(a==="timer"){if(tm){clearInterval(tm);tm=null;left=1500}else{tm=setInterval(()=>{if(--left<=0){clearInterval(tm);tm=null;left=1500;const c=COURSES[sel][0];d.mins[c]=(d.mins[c]||0)+25;d.xp+=15;save()}R()},1000)}R()}
 if(a==="review")$("#out").value=JSON.stringify(review(),null,2);
 if(a==="backup")$("#out").value=JSON.stringify(S);
 if(a==="copy"){$("#out").select();try{navigator.clipboard.writeText($("#out").value)}catch(x){}}
 if(a==="import"){try{const j=JSON.parse($("#in").value);if(j.days){S=j;norm();msg="Backup restored."}else if(Array.isArray(j.dailyChecklist)){S.plan=j;msg="Plan imported. Check Today."}else throw 0;save();R()}catch(x){msg="That JSON isn’t a plan or a backup. Check the format and try again.";R()}}
});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(a==="sel")sel=+t.value;if(a==='wind'){S.wind=Math.min(23,Math.max(0,+t.value||22));save()}if(a==='eth'){S.eth=t.value==='1';save();R()}if(a==="bp"){S.base.p=+t.value;save()}if(a==="bs"){S.base.s=+t.value;save()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.a==="top"){D().top[+t.dataset.i]=t.value;save()}});
addEventListener('hashchange',R);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
R();
</script></body></html>
